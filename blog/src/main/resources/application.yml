spring:
  application:
    name: service-system
  profiles:
    active: pro
  jackson:
    # 统一下划线格式如：is_del
#    property-naming-strategy: SNAKE_CASE
  # 约束文件上传大小
  servlet.multipart.max-file-size: 10MB
  servlet.multipart.max-request-size: 100MB

logging.level.org.springframework.mail: DEBUG
logging.level.org.springframework.boot.autoconfigure.mail: DEBUG

jwt:
  # 设置jwt过期时间
  ttl: 259200000
  # 设置前端传递过来的令牌名称
  token-name: Authorization

# API文档配置（springdoc + Swagger UI：文档元数据在 OpenApiConfig 的 OpenAPI Bean 中）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

file:
  dir: ./upload/

# 使用 @EnumValue 与数据库整型互转（否则默认按枚举名映射会报错）
mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

# 限流注解配置
blog:
  limit:
    tokens: 100     # 所有受限接口统一每周期允许 x 次
    duration: 60    # 周期统一为 60 秒
    blacklist:
      threshold: 10  # 触发黑名单的限流次数阈值
      duration: 60 # 黑名单持续时间（分钟）