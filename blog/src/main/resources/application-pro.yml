server:
  port: ${PORT:9003}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_INFO}?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

jwt:
  # 设置jwt签名加密时使用的秘钥
  secret-key: ${JWT_SECRET_KEY:thrivex-default-jwt-secret-key-please-change}

# 生产环境关闭 API 文档（基础配置默认开启，此处兜底防止误开到公网）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  scalar:
    enabled: false